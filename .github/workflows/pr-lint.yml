name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: conventional commit
    runs-on: ubuntu-latest
    # Dependabot writes its own titles and capitalises the subject ("Bump the actions group…").
    # Its prefixes are already set in dependabot.yml, so the format is under our control; linting
    # style on a machine-authored title just produces a red check nobody can act on.
    if: github.actor != 'dependabot[bot]'
    steps:
      # PRs are squash-merged, so the PR TITLE becomes the commit message on main — which is what
      # release-please reads to decide the next version. Linting the title is therefore linting
      # the release notes, and it is far less friction for contributors than a hook on every
      # local commit.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # No scope allowlist. Scopes are optional and free-form: release-please groups the
          # changelog by TYPE, so a closed list buys no consistency where it matters, while every
          # new feature area needs a config change before its first PR can pass. That is exactly
          # how `feat(budgets)` got rejected — the list was derived from src/ directory names and
          # the app had already grown past them.
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is not formatted correctly: start it lowercase and leave off
            the trailing period, e.g. `fix(sync): keep the grant when a refresh 5xxs`.
